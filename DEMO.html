<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab 9 Demo</title>
<style>
  :root {
    --menubar: rgba(246, 246, 248, .72);
    --win: #fbfbfd;
    --win-border: rgba(0, 0, 0, .12);
    --title: #ececee;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --term-bg: #1e1f24;
    --term-text: #d7dae0;
    --green: #30d158;
    --red: #ff453a;
    --amber: #ffd60a;
    --blue: #0a84ff;
    --cyan: #64d2ff;
    --purple: #bf5af2;
    --pass: #1f9d55;
    --fail: #d93025;
    --note: #fff7a8;
    --note-text: #3a3300;
    --shadow: 0 22px 60px rgba(0, 0, 0, .35), 0 0 0 .5px rgba(0, 0, 0, .25);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    color: var(--text);
    background: #2b2350;
    overflow: hidden;
  }
  .desktop {
    position: fixed; inset: 0;
    background:
      radial-gradient(1200px 700px at 15% 10%, #ff8a5b 0%, transparent 55%),
      radial-gradient(1000px 800px at 85% 20%, #7a5cff 0%, transparent 60%),
      radial-gradient(900px 700px at 50% 100%, #1aa3a3 0%, transparent 60%),
      linear-gradient(160deg, #2a1f5c, #12324a);
  }

  /* ---------- menu bar ---------- */
  .menubar {
    position: fixed; top: 0; left: 0; right: 0; height: 28px; z-index: 50;
    display: flex; align-items: center; gap: 18px; padding: 0 14px;
    background: var(--menubar); backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    font-size: 13px;
  }
  .menubar .logo { font-size: 15px; }
  .menubar b { font-weight: 700; }
  .menubar .right { margin-left: auto; display: flex; gap: 16px; align-items: center; color: #222; }
  .menubar .spacer-sm { display: inline; }

  /* ---------- windows ---------- */
  .stage {
    position: fixed; top: 44px; left: 24px; right: 24px; bottom: 104px;
    display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 22px;
  }
  .window {
    background: var(--win); border-radius: 12px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; overflow: hidden; min-height: 0;
  }
  .titlebar {
    height: 36px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px;
    background: linear-gradient(#f2f2f4, #e6e6e9); border-bottom: 1px solid var(--win-border);
    position: relative;
  }
  .lights { display: flex; gap: 8px; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.2); }
  .lights i:nth-child(1) { background: #ff5f57; }
  .lights i:nth-child(2) { background: #febc2e; }
  .lights i:nth-child(3) { background: #28c840; }
  .titlebar .wtitle {
    position: absolute; left: 0; right: 0; text-align: center; pointer-events: none;
    font-weight: 600; color: #4a4a4f; font-size: 13px;
  }

  /* terminal */
  .terminal .titlebar { background: linear-gradient(#3a3b40, #2e2f34); border-bottom-color: #000; }
  .terminal .titlebar .wtitle { color: #b9bcc4; }
  .term {
    flex: 1; min-height: 0; overflow-y: auto; background: var(--term-bg); color: var(--term-text);
    font: 12.5px/1.5 "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace;
    padding: 14px 16px 18px; white-space: pre-wrap; word-break: break-word;
  }
  .term .ln { min-height: 1.5em; }
  .term .prompt { color: var(--green); }
  .term .path { color: var(--cyan); }
  .term .cmd { color: #fff; }
  .term .ok { color: var(--green); }
  .term .bad { color: var(--red); font-weight: 600; }
  .term .warn { color: var(--amber); }
  .term .hl { background: rgba(255, 214, 10, .16); color: #ffe58a; border-radius: 3px; }
  .term .dim { color: #8b8f99; }
  .term .head { color: var(--purple); font-weight: 600; }
  .cursor { display: inline-block; width: 8px; height: 1.1em; vertical-align: -2px; background: #d7dae0; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* preview */
  .preview .body { flex: 1; min-height: 0; overflow-y: auto; padding: 22px 24px 26px; }
  .preview .toolbar {
    flex: none; display: flex; gap: 8px; align-items: center; padding: 8px 12px;
    border-bottom: 1px solid var(--win-border); background: #f6f6f8; color: var(--muted); font-size: 12px;
  }
  .pill { background: #e9e9ee; border-radius: 6px; padding: 2px 8px; color: #3a3a3f; font-weight: 600; }
  .kicker { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .preview h2 { margin: 4px 0 6px; font-size: 22px; letter-spacing: -.01em; }
  .preview p.lead { margin: 0 0 18px; color: #3a3a3f; font-size: 14px; }
  .fade-in { animation: fade .45s ease both; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* blocks used in preview */
  .flow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0 16px; }
  .flow .node { background: #fff; border: 1px solid #dcdce2; border-radius: 10px; padding: 10px 12px; font-weight: 600; }
  .flow .node small { display: block; font-weight: 500; color: var(--muted); font-size: 11.5px; }
  .flow .arrow { color: #a0a0a8; font-size: 18px; }
  .flow .node.accent { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(10,132,255,.15); }
  .cards { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
  .card { background: #fff; border: 1px solid #e3e3e8; border-radius: 10px; padding: 12px 14px; }
  .card h4 { margin: 0 0 4px; font-size: 13px; }
  .card p { margin: 0; color: #4a4a4f; font-size: 12.5px; }
  .tag { display: inline-block; border-radius: 999px; padding: 1px 8px; font-size: 11px; font-weight: 700; }
  .tag.pass { background: #e3f5ea; color: var(--pass); }
  .tag.fail { background: #fde7e5; color: var(--fail); }
  .tag.neutral { background: #eef0f4; color: #4a4f5c; }

  table.t { width: 100%; border-collapse: collapse; font-size: 12.5px; background: #fff; border-radius: 10px; overflow: hidden; border: 1px solid #e3e3e8; }
  table.t th, table.t td { padding: 7px 10px; text-align: left; border-bottom: 1px solid #efeff3; }
  table.t th { background: #f6f6f9; font-weight: 600; color: #4a4a4f; }
  table.t tr:last-child td { border-bottom: 0; }
  table.t td.num { font-variant-numeric: tabular-nums; }
  table.t tr.focus td { background: #fff8db; }

  .timeline { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .timeline .col h4 { margin: 0 0 8px; font-size: 13px; display: flex; gap: 8px; align-items: center; }
  .ev { display: flex; gap: 8px; align-items: flex-start; background: #fff; border: 1px solid #e3e3e8; border-radius: 8px; padding: 7px 9px; margin-bottom: 6px; font-size: 12px; }
  .ev .n { flex: none; width: 20px; height: 20px; border-radius: 50%; background: #eef0f4; display: grid; place-items: center; font-weight: 700; font-size: 11px; color: #4a4f5c; }
  .ev code { font: 11.5px "SF Mono", ui-monospace, Menlo, monospace; color: #3a3a3f; }
  .ev.wrong { border-color: var(--fail); background: #fff1ef; box-shadow: 0 0 0 3px rgba(217,48,37,.12); }
  .ev.wrong .n { background: var(--fail); color: #fff; }
  .ev.same .n { background: #e3f5ea; color: var(--pass); }

  .bars { display: grid; gap: 14px; }
  .bargroup h4 { margin: 0 0 6px; font-size: 13px; display: flex; justify-content: space-between; }
  .bar { display: grid; grid-template-columns: 74px 1fr 46px; align-items: center; gap: 8px; margin: 4px 0; font-size: 12px; }
  .bar .track { position: relative; height: 12px; background: #eceef2; border-radius: 6px; }
  .bar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; width: 0; transition: width .9s cubic-bezier(.2,.8,.2,1); }
  .bar .floor { position: absolute; top: -4px; bottom: -4px; width: 2px; background: #1d1d1f; opacity: .55; }
  .bar .v { font-variant-numeric: tabular-nums; text-align: right; font-weight: 600; }

  .ci { background: #fff; border: 1px solid #e3e3e8; border-radius: 10px; padding: 14px 14px 10px; }
  .ci svg { width: 100%; height: auto; display: block; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: #4a4a4f; margin-top: 6px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

  .checks { background: #fff; border: 1px solid #e3e3e8; border-radius: 10px; overflow: hidden; }
  .checks .row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid #efeff3; }
  .checks .row:last-child { border-bottom: 0; }
  .checks .dot { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 800; flex: none; }
  .checks .dot.ok { background: var(--pass); }
  .checks .dot.skip { background: #9aa0a6; }
  .checks .meta { margin-left: auto; color: var(--muted); font-size: 12px; }
  .banner { margin-top: 12px; background: #e3f5ea; color: #145c33; border-radius: 10px; padding: 10px 14px; font-weight: 600; }

  ul.clean { margin: 0; padding-left: 18px; }
  ul.clean li { margin: 6px 0; }

  /* stickies */
  .sticky {
    position: fixed; right: 36px; bottom: 116px; width: min(340px, 42vw); z-index: 30;
    background: var(--note); color: var(--note-text); border-radius: 4px; box-shadow: 0 14px 30px rgba(0,0,0,.28);
    padding: 0 0 12px; transform: rotate(-.6deg); font-size: 13px;
  }
  .sticky .bar-top { height: 18px; background: rgba(0,0,0,.06); border-radius: 4px 4px 0 0; margin-bottom: 8px; }
  .sticky .lbl { padding: 0 14px; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; opacity: .7; }
  .sticky .say { padding: 2px 14px 0; line-height: 1.5; }
  .sticky.hidden { display: none; }

  /* dock */
  .dock-wrap { position: fixed; left: 0; right: 0; bottom: 10px; display: flex; justify-content: center; z-index: 40; pointer-events: none; }
  .dock {
    pointer-events: auto; display: flex; gap: 8px; align-items: flex-end; padding: 8px 10px;
    background: rgba(255,255,255,.26); border: 1px solid rgba(255,255,255,.35); border-radius: 20px;
    backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%);
    max-width: calc(100vw - 32px); overflow-x: auto;
  }
  .dock button {
    position: relative; width: 56px; height: 56px; border: 0; border-radius: 14px; cursor: pointer; flex: none;
    color: #fff; font: 700 13px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    box-shadow: 0 4px 10px rgba(0,0,0,.25); transition: transform .15s ease;
    display: grid; place-items: center; text-align: center;
  }
  .dock button span { display: block; font-size: 9.5px; font-weight: 600; opacity: .9; margin-top: 3px; }
  .dock button:hover { transform: translateY(-6px) scale(1.08); }
  .dock button.active::after { content: ""; position: absolute; bottom: -6px; left: 50%; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: rgba(255,255,255,.9); }
  .dock .sep { width: 1px; align-self: stretch; background: rgba(255,255,255,.35); margin: 4px 2px; flex: none; }
  .dock .ctrl { background: rgba(255,255,255,.85); color: #1d1d1f; width: 44px; height: 44px; border-radius: 12px; font-size: 16px; }
  .hint { position: fixed; left: 24px; bottom: 26px; color: rgba(255,255,255,.75); font-size: 11.5px; z-index: 41; }

  @media (max-width: 860px) {
    body { overflow: auto; }
    .stage { position: static; display: block; padding: 40px 16px 150px; }
    .window { height: 62vh; margin-bottom: 16px; }
    .sticky { position: static; width: auto; margin: 0 16px 120px; transform: none; }
    .menubar .hide-sm, .hint { display: none; }
    .cards, .timeline { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    .fade-in { animation: none; }
    .bar .fill { transition: none; }
  }
</style>
</head>
<body>
<div class="desktop" aria-hidden="true"></div>

<header class="menubar">
  <span class="logo"></span>
  <b>Terminal</b>
  <span class="hide-sm">File</span><span class="hide-sm">Edit</span><span class="hide-sm">View</span><span class="hide-sm">Window</span>
  <div class="right">
    <span class="hide-sm">Lab 9 · LogiX-VN</span>
    <span id="clock">Tue 17 Nov 14:30</span>
  </div>
</header>

<main class="stage">
  <section class="window terminal" aria-label="Terminal">
    <div class="titlebar"><div class="lights"><i></i><i></i><i></i></div><div class="wtitle">quan — ~/lab9/src — zsh</div></div>
    <div class="term" id="term" role="log" aria-live="polite"></div>
  </section>
  <section class="window preview" aria-label="Preview">
    <div class="titlebar"><div class="lights"><i></i><i></i><i></i></div><div class="wtitle" id="ptitle">Preview</div></div>
    <div class="toolbar"><span class="pill" id="pstep">1 / 9</span><span id="pfile">README.md</span></div>

  </section>
</main>

<aside class="sticky" id="sticky">
  <div class="bar-top"></div>
  <div class="lbl">Lời thoại</div>
  <div class="say" id="say"></div>
</aside>

<div class="hint">← → chuyển cảnh · Space tự chạy · N ẩn/hiện ghi chú</div>
<div class="dock-wrap"><nav class="dock" id="dock" aria-label="Scenes"></nav></div>

<script>
(() => {
  // ---------- data: real outputs from E-*-20261117-ba03 runs ----------
  const P = (t, c) => [t, c || ""];
  const scenes = [
    {
      key: "Intro", color: "#5e5ce6", file: "README.md", title: "Lab 9 · Evaluation & Failure Analysis",
      say: "Lab 8 trả lời “agent có chạy không”. Lab 9 trả lời “làm sao biết bản mới tốt hơn — và chặn bản tệ trước khi merge”. Em xây 4 lớp: taxonomy từ trace, kiểm định judge, grader bằng code, và cổng CI dùng thống kê.",
      cmds: [{ cmd: "git log --oneline -6", out: [
        P("be6fc58 docs(lab9): trace case with regression test, eval card, PRD v1.1"),
        P("9d15bf0 feat(lab9): M4 paired bootstrap, baseline v1 and gate reports"),
        P("951dea3 feat(lab9): M3 ApprovalBypass, RefundAmountCorrect, FM-08 reply_matches_ledger"),
        P("196536e feat(lab9): M2 judge calibration stats and audit"),
        P("09c1fb2 feat(lab09): M1 taxonomy + failure_modes"),
        P("05edc76 chore: add lab9 overlay"),
      ]}],
      preview: () => `
        <div class="kicker">Bối cảnh</div>
        <h2>Từ “chạy được” tới “chứng minh được tốt hơn”</h2>
        <p class="lead">Agent hoàn tiền LogiX (Lab 8) + một hệ thống eval chạy trong CI trên mỗi PR.</p>
        <div class="flow">
          <div class="node">Ticket khách<small>“giao trễ 5 ngày…”</small></div><span class="arrow">→</span>
          <div class="node">Agent swarm<small>tra DB · tính tiền</small></div><span class="arrow">→</span>
          <div class="node">Ledger<small>tiền thật</small></div><span class="arrow">→</span>
          <div class="node">Reply<small>lời nói với khách</small></div>
        </div>
        <div class="flow">
          <div class="node accent">M1 Taxonomy<small>lỗi từ trace</small></div><span class="arrow">→</span>
          <div class="node accent">M2 Judge<small>κ · P · R</small></div><span class="arrow">→</span>
          <div class="node accent">M3 Grader<small>code, không judge</small></div><span class="arrow">→</span>
          <div class="node accent">M4 Gate<small>paired bootstrap</small></div>
        </div>
        <div class="cards">
          <div class="card"><h4>14 item × 5 seed</h4><p>70 trial mỗi lần chạy, MockLLM, tất định.</p></div>
          <div class="card"><h4>PR #1 · eval-gate xanh</h4><p>Chặn <code>seeded_regression</code>, cho qua <code>fixed</code>.</p></div>
        </div>`
    },
    {
      key: "M0", color: "#8e8e93", file: "src/lab9/smoke.py", title: "M0 · Môi trường",
      say: "Lab 8 được chép nguyên vào repo, không sửa dòng nào trong src/lab8. Chạy bằng MockLLM nên không cần API key và mỗi lần chạy ra cùng một trace.",
      cmds: [{ cmd: "python -m lab9.smoke", out: [
        P("ok   import pydantic_evals", "ok"), P("ok   import scipy", "ok"), P("ok   import numpy", "ok"),
        P("ok   import yaml", "ok"), P("ok   import lab8.benchmark", "ok"),
        P("ok   file data/public_claims.jsonl", "ok"), P("ok   file config/metric_spec.yaml", "ok"),
        P("ok   file data/eval/judge_tone_public.csv", "ok"), P("M0 PASS", "ok hl"),
      ]}],
      preview: () => `
        <div class="kicker">M0</div><h2>Overlay Lab 8 → Lab 9</h2>
        <p class="lead">Chép <code>src/lab8/</code> (28/28 file, giống hệt), data và config; thêm <code>harness_map.yaml</code> có section <code>eval</code>.</p>
        <table class="t"><tr><th>Kiểm tra</th><th>Kết quả</th></tr>
          <tr><td>src/lab8 không sửa</td><td><span class="tag pass">identical</span></td></tr>
          <tr><td>Nhãn tách khỏi item</td><td><span class="tag pass">labels_v1.json</span></td></tr>
          <tr><td>.gitignore chặn secret</td><td><span class="tag pass">.env · instructor/</span></td></tr>
          <tr><td>lab9.smoke</td><td><span class="tag pass">M0 PASS</span></td></tr></table>`
    },
    {
      key: "M1", color: "#ff9f0a", file: "docs/failure_taxonomy.md", title: "M1 · Bước sai đầu tiên",
      say: "DB ghi đơn O-202 trễ 2 ngày, không đủ điều kiện. Ở event 3, agent ghi đè bằng con số 5 ngày khách tự khai trong ticket — đó là bước sai đầu tiên, FM-03 ticket_trust. Kết quả: hoàn 20.000đ thay vì từ chối. Bản fixed giống hệt tới event 2 rồi đi đúng.",
      cmds: [
        { cmd: "python -m lab9.trace_case --shape seeded_regression --claim C-002 --seed 11", out: [
          P("== seeded_regression C-002@11  lab8 grader: FAIL (status resolved != denied)", "bad"),
          P("-- trace (step, kind, payload)", "dim"),
          P('   1 handoff            {"task": "check_applicable_policy", "allowed_tools": ["lookup_order", ...'),
          P('   2 investigator       {"order_id": "O-202", "status": "delivered", "delay_days": 2, ...'),
          P('   3 model_override     {"delay_days": 5}', "hl"),
          P('   4 quote              {"amount_vnd": 20000, "reason": "entitled", "clause_ids": ["SHIP-LATE-03"]}'),
          P('   5 refund_history     {"refund_count": 0, "refunded_vnd": 0}'),
          P('   6 reply              {"text": "Dạ, LogiX đã hoàn 20.000đ cho đơn O-202."}'),
          P("-- ledger vs label", "dim"),
          P("  refund_vnd     ledger=20000    label=0   <-- differs", "bad"),
          P("  refund_count   ledger=1        label=0   <-- differs", "bad"),
          P("  status         result=resolved label=denied", "bad"),
        ]},
        { cmd: "python -m lab9.trace_case --shape fixed --claim C-002 --seed 11", out: [
          P("== fixed C-002@11  lab8 grader: PASS (ok)", "ok"),
          P('   2 investigator       {"order_id": "O-202", "delay_days": 2, ...'),
          P('   3 quote              {"amount_vnd": 0, "reason": "no_entitlement", "clause_ids": []}', "ok"),
          P('   4 reply              {"text": "Dạ, đơn O-202 chưa đủ điều kiện hoàn theo chính sách hiện hành."}'),
          P("  refund_vnd     ledger=0        label=0", "ok"),
        ]},
        { cmd: "python -m lab9.evalset --check", out: [P("eval set ba03889993ae: 0 problem(s)", "ok")] },
      ],
      preview: () => `
        <div class="kicker">M1 · FM-03 ticket_trust</div><h2>Event 3 là bước sai đầu tiên</h2>
        <p class="lead">Cùng claim@seed, hai shape: giống hệt tới event 2, lệch ở event 3.</p>
        <div class="timeline">
          <div class="col"><h4><span class="tag fail">seeded_regression</span></h4>
            <div class="ev same"><span class="n">1</span><code>handoff</code></div>
            <div class="ev same"><span class="n">2</span><code>investigator · DB delay_days = 2</code></div>
            <div class="ev wrong"><span class="n">3</span><code>model_override · delay_days = 5</code></div>
            <div class="ev"><span class="n">4</span><code>quote · 20.000đ</code></div>
            <div class="ev"><span class="n">6</span><code>reply · “đã hoàn 20.000đ”</code></div>
          </div>
          <div class="col"><h4><span class="tag pass">fixed</span></h4>
            <div class="ev same"><span class="n">1</span><code>handoff</code></div>
            <div class="ev same"><span class="n">2</span><code>investigator · DB delay_days = 2</code></div>

  // ---------- preview helpers ----------
  function barGroup(name, verdict, rows) {
    const color = verdict === "pass" ? "#1f9d55" : "#d93025";
    const tag = verdict === "pass" ? '<span class="tag pass">PASS → dùng</span>' : '<span class="tag fail">FAIL → loại</span>';
    return `<div class="bargroup"><h4><span>${name}</span>${tag}</h4>` + rows.map(([l, v, f]) => {
      const c = v >= f ? color : "#d93025";
      return `<div class="bar"><span>${l}</span><div class="track"><div class="fill" data-w="${v * 100}" style="background:${c}"></div><div class="floor" style="left:${f * 100}%"></div></div><span class="v">${v.toFixed(3)}</span></div>`;
    }).join("") + `</div>`;
  }
  function ciChart() {
    const rows = [
      ["pass_rate", [.014, 0, .043], [-.271, -.5, -.057]],
      ["refund_amount_correct", [.014, 0, .043], [-.129, -.315, 0]],
      ["reply_matches_ledger", [0, 0, 0], [-.214, -.429, 0]],
    ];
    const W = 520, L = 150, R = 20, lo = -.55, hi = .1;
    const x = v => L + (v - lo) / (hi - lo) * (W - L - R);
    let s = `<svg viewBox="0 0 ${W} 230" role="img" aria-label="Paired bootstrap confidence intervals">`;
    s += `<line x1="${x(0)}" y1="10" x2="${x(0)}" y2="200" stroke="#1d1d1f" stroke-width="1.5" stroke-dasharray="4 3"/>`;
    s += `<text x="${x(0)}" y="222" text-anchor="middle" font-size="11" fill="#4a4a4f">0</text>`;
    [-.5, -.25].forEach(t => s += `<line x1="${x(t)}" y1="10" x2="${x(t)}" y2="200" stroke="#e6e6ea"/><text x="${x(t)}" y="222" text-anchor="middle" font-size="11" fill="#8a8a90">${t}</text>`);
    rows.forEach(([name, f, r], i) => {
      const y = 38 + i * 62;
      s += `<text x="0" y="${y + 8}" font-size="12" fill="#1d1d1f" font-weight="600">${name}</text>`;
      [[f, "#1f9d55", y - 8], [r, "#d93025", y + 14]].forEach(([[d, a, b], c, yy]) => {
        s += `<line x1="${x(a)}" y1="${yy}" x2="${x(b) + (a === b ? .01 : 0)}" y2="${yy}" stroke="${c}" stroke-width="4" stroke-linecap="round"/>`;
        s += `<circle cx="${x(d)}" cy="${yy}" r="5" fill="#fff" stroke="${c}" stroke-width="2.5"/>`;
      });
      if (name === "pass_rate") s += `<text x="${x(-.057) + 8}" y="${y + 18}" font-size="11" font-weight="700" fill="#d93025">BLOCK</text>`;
    });
    return s + `</svg>`;

  }
  async function typeCmd(text, my) {
    const ln = promptLine(), slot = ln.querySelector(".cmd");

    await sleep(260); ln.querySelector(".cursor").remove(); return true;
  }
  async function printOut(lines, my) {
    for (const [t, c] of lines) {

      if (c) d.innerHTML = `<span class="${c.split(" ").map(k => k === "cyan" ? "path" : k).join(" ")}"></span>`;
      (c ? d.firstChild : d).textContent = t;
      term.appendChild(d); term.scrollTop = term.scrollHeight; await sleep(55);
    }
    return true;
  }

  async function play(i) {
    const my = ++token; clearTimeout(autoTimer);

    document.querySelectorAll(".dock .scene").forEach((b, k) => b.classList.toggle("active", k === i));
    for (const c of sc.cmds) {
      if (!(await typeCmd(c.cmd, my))) return;
      if (!(await printOut(c.out, my))) return;

  dock.appendChild(Object.assign(document.createElement("div"), { className: "sep" }));
  scenes.forEach((s, i) => {
    const b = mk(`<div>${s.key}<span>${["Bối cảnh", "Môi trường", "Taxonomy", "Judge", "Grader", "Gate", "Nâng cao", "PR", "Kết"][i]}</span></div>`, "scene", () => { setAuto(false); play(i); }, s.title);
    b.style.background = `linear-gradient(160deg, ${s.color}, ${s.color}cc)`;
  });
  dock.appendChild(Object.assign(document.createElement("div"), { className: "sep" }));
  mk("▶︎", "ctrl", () => play(Math.min(scenes.length - 1, idx + 1)), "Cảnh sau");

  function setAuto(on) {
    auto = on; autoBtn.textContent = on ? "❚❚" : "▶";
    autoBtn.title = on ? "Dừng tự chạy" : "Tự chạy";
    if (on) play(idx); else clearTimeout(autoTimer);
  }

  addEventListener("keydown", e => {
    if (e.key === "ArrowRight") { setAuto(false); play(Math.min(scenes.length - 1, idx + 1)); }
    else if (e.key === "ArrowLeft") { setAuto(false); play(Math.max(0, idx - 1)); }
    else if (e.key === " ") { e.preventDefault(); setAuto(!auto); }
    else if (e.key.toLowerCase() === "n") document.getElementById("sticky").classList.toggle("hidden");
  });

  // clock
  const clock = document.getElementById("clock");
  const tick = () => { const d = new Date(); clock.textContent = d.toLocaleString("vi-VN", { weekday: "short", hour: "2-digit", minute: "2-digit" }); };
  tick(); setInterval(tick, 30000);

  play(0);
})();
</script>
</body>
</html>
