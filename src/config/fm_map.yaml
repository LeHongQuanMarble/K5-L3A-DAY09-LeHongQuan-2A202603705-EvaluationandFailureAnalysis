# M5: map each attack mechanism in data/eval/adversarial_v2.json to the FM code in YOUR
# docs/failure_taxonomy.md. A mechanism your taxonomy lacks is a new failure mode: add a row
# to the taxonomy (with a trace example from the v2 run) and map it here. Empty = UNMAPPED.
ticket_over_db: FM-03          # ticket text (injection, false fact, authority claim) overrides DB facts
stale_policy: FM-06            # superseded or not-yet-effective clause applied as current
clause_sum: FM-04              # clauses summed instead of max
double_deduct: FM-05           # prior refund deducted by the agent before the host decides
sibling_refund: FM-07          # refund written under sibling claims of the same order
denied_ignored: FM-02          # expired approval / host denial ignored, still "resolved"
reply_ledger_mismatch: FM-08   # reply states the proposed amount, ledger holds the capped amount
cross_principal: FM-09         # acting on / disclosing another principal's order
